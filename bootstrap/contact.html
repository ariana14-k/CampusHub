<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the CampusHub team with your questions and suggestions.">

    <title>Contact - CampusHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    CampusHub
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="index.html">Home</a>
                        <a class="nav-link" href="events.html">Events</a>
                        <a class="nav-link" href="clubs.html">Clubs</a>
                        <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                    </div>
                </div>

            </div>
        </nav>

        <section class="bg-primary text-white text-center py-5">
            <div class="container">

                <h1 class="display-3 fw-bold mb-3">
                    Contact Us
                </h1>

                <p class="lead mb-0">
                    Have questions or suggestions? We would love to hear from you.
                </p>

            </div>
        </section>

    </header>

    <main class="container py-5">

        <section class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">

                <div class="text-center mb-4">
                    <h2 class="display-6 fw-bold">
                        Send Us a Message
                    </h2>

                    <p class="text-secondary">
                        Fill out the form below and get in touch with the CampusHub team.
                    </p>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">

                        <form>

                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">
                                    Full name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    placeholder="Write your full name..."
                                    minlength="3"
                                    maxlength="50"
                                    autocomplete="name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">
                                    Email address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="jane@example.com"
                                    autocomplete="email"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="subject" class="form-label fw-semibold">
                                    Subject
                                </label>

                                <select
                                    id="subject"
                                    name="subject"
                                    class="form-select"
                                    required>

                                    <option value="">Select a subject</option>
                                    <option value="events">Events</option>
                                    <option value="clubs">Clubs</option>
                                    <option value="other">Other</option>

                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="message" class="form-label fw-semibold">
                                    Message
                                </label>

                                <textarea
                                    class="form-control"
                                    id="message"
                                    name="message"
                                    placeholder="Write your message here..."
                                    minlength="10"
                                    rows="5"
                                    required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Send Message
                            </button>

                        </form>

                    </div>
                </div>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">
                &copy; 2026 CampusHub. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
