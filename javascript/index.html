<!DOCTYPE html>
<html>
    <head>
        <title>Javascript</title>

        <style>
            .highlight {
                background-color: lightblue;
                padding: 10px;
            }
        </style>
    </head>

    <body>
        <h1 id="heading">Hyrje ne Javascript</h1>

        <p 
            onmouseover="this.style.color='blue'"
            onmouseout="this.style.color='black'"
        id="message">Old message</p>
        <p id="text" style="display: none;">New message</p>

        <!-- <img id="eventImg" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZjwivmat-j5ygTHEK1aAGcTofSvz47oQHjMewB-cDZQ&s=10"> -->
        <button type="button" onclick="changeMessage()">Change message</button>

        <select onchange="showSelection(this.value)">
            <option value="">Choose an event</option>
            <option value="Workshops">Workshops</option>
            <option value="Hackathons">Hackathons</option>
        </select>

        <input type="text" onkeydown="console.log('A kew was pressed')">

        <form onsubmit="submitForm()">
            <input type="text" placeholder="your name">
            <button type="submit">Submit</button>
        </form>

        <button id="myButton">Click Me</button>

        <p class="text">Teksti 1</p>
        <p class="text">Teksti 2</p>
        <p class="text">Teksti 3</p>

        <div id="events"></sdiv>

        <section class="event-card">
            <p>This is a paragraph.</p>
        </section>

        <button type="button" id="add-css">Add Highlight</button>
        <button type="button" id="remove-css">Remove Highlight</button>
        <button type="button" id="toggle-css">Toggle Highlight</button>

        <form id="contactForm">
            <input type="text" id="name" placeholder="Your name">
            <input type="email" id="email" placeholder="Your email">
            <textarea id="message-text" placeholder="Your message"></textarea>

            <button type="submit">Send Message</button>
        </form>

        <div id="posts"></div>

        <script src="script.js" defer></script>
        <script src="script2.js" defer></script>

</html>
