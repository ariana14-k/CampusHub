<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - CampusHub</title>
    <link rel="stylesheet" href="styles/styles.css">

</head>

<body>

    <header>

        <h1>CampusHub</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="clubs.html">Clubs</a>
            <a href="#">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>
        <section>
            <h2>Contact us</h1>

                <p>
                    Have any questions about CampusHub?
                    <br>Send us a message.
                </p>

                <form>
                    <div>
                        <label for="name">Full name:</label>
                        <input type="text" id="name" name="name" placeholder="Write your full name..." required minLength="3" maxLength="50">
                    </div>

                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
                    </div>

                    <div>
                        <label for="subject">Subject:</label>
                        <select name="subject" id="subject" required>
                            <option value="">Select subject</option>
                            <option value="events">Events</option>
                            <option value="clubs">Clubs</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" required minLength="10" rows="5"></textarea>
                    </div>

                    <button type="submit">Submit</button>
                </form>

        </section>


    </main>

    <footer>

        <p>&copy; 2026 CampusHub</p>

    </footer>

</body>

</html>
